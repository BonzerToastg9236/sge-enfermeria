# /etc/nginx/sites-available/sge   (VARIANTE para Cloudflare Tunnel / túnel inverso)
#
# Úsala EN LUGAR de nginx_sge.conf cuando el HTTPS lo termina Cloudflare y
# `cloudflared` entrega las peticiones a este Nginx por http://127.0.0.1:80.
# Ver deploy/DEPLOYMENT.md, Anexo A3.
#
# POR QUÉ ES DISTINTA: con un túnel TODAS las peticiones llegan a Nginx desde
# 127.0.0.1. La app decide "de quién es cada intento de login" con la IP que le
# reenvía Nginx (ProxyFix, x_for=1). Con la config normal esa IP sería siempre
# 127.0.0.1 y el límite de 5 intentos por minuto sería UNO para todos los
# usuarios. Aquí se recupera la IP real de la visita desde CF-Connecting-IP (que
# solo se acepta si viene de 127.0.0.1, es decir, de cloudflared) y se reenvía.
#
# ESTADO: no probada en un servidor real (ver Anexo A3). Haz la prueba A6.

server {
    listen 127.0.0.1:80;          # solo local: al mundo lo expone el túnel, no este puerto
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    client_max_body_size 10M;     # >= MAX_CONTENT_LENGTH de config.py (8 MB)

    # IP real de la visita (solo confiamos en la cabecera si la manda cloudflared, local)
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # --- Cabeceras de seguridad (igual que nginx_sge.conf) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS lo puede añadir Cloudflare (SSL/TLS > Edge Certificates > HSTS) cuando confirmes que todo funciona.
    server_tokens off;

    location /static/ {
        alias /home/sge/sge_enfermeria/static/;
        expires 30d;
        access_log off;
    }

    location / {
        # Cabeceras explícitas (sin `include proxy_params`, que añadiría de nuevo
        # X-Forwarded-For con la IP local y volvería a mezclar a todos los usuarios).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr ya es la IP real (real_ip_header)
        proxy_set_header X-Forwarded-Proto https;        # la visita SÍ llegó por HTTPS (a Cloudflare)
        proxy_pass http://unix:/home/sge/sge_enfermeria/sge.sock;
    }
}
