# /etc/nginx/sites-available/sge
#
# Este archivo va en el servidor, NO en tu proyecto. Instrucciones de
# instalación completas en deploy/DEPLOYMENT.md.
#
# Qué hace: recibe TODAS las peticiones web (puerto 80/443) y:
#   - Si piden un archivo estático GENUINAMENTE público (CSS, JS, imágenes de
#     la interfaz), Nginx lo entrega DIRECTAMENTE del disco (mucho más rápido
#     que pedirle a Python/Flask que lo haga).
#   - Si piden cualquier otra cosa (una ruta de Flask, incluyendo ver un
#     documento de un alumno), se la reenvía a Gunicorn a través del socket
#     Unix -- ahí Flask sí exige sesión + rol antes de servir el archivo.
#
# SECURITY-NOTE: los documentos de alumnos (INE, CURP, actas) viven en
# instance/documentos_alumnos/, FUERA de static/, a propósito. Si alguna vez
# alguien los mueve de vuelta a static/, este alias los serviría a CUALQUIERA
# sin pasar por Flask ni por su control de rol.

server {
    listen 80;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;
    # Si todavía no tienes dominio, usa la IP del VPS aquí en su lugar,
    # ej: server_name 123.45.67.89;

    client_max_body_size 10M;
    # Debe ser >= MAX_CONTENT_LENGTH de config.py (8 MB) para que Nginx
    # no rechace la subida de documentos ANTES de que Flask la reciba.

    # ========================================================
    # CABECERAS DE SEGURIDAD [D7 de la auditoría]
    # ========================================================
    # Certbot agrega el cifrado TLS, pero NO agrega ninguna de estas
    # cabeceras. Son instrucciones que el servidor le da al navegador
    # sobre qué NO permitir. En un sistema que maneja expedientes de
    # alumnos (INE, CURP, actas, calificaciones), vale la pena tenerlas.
    #
    # Van a nivel de "server" para que apliquen a TODAS las respuestas.
    #
    # OJO SI ALGUIEN LAS MUEVE: en Nginx, si un bloque "location" define
    # su propio add_header, DEJA DE HEREDAR los de este nivel (los pierde
    # todos, no solo el repetido). Por eso están aquí arriba y los
    # location de abajo no definen ninguno.

    # Impide que otro sitio meta el SGE dentro de un <iframe> invisible
    # para engañar al usuario y hacerle dar clics donde no cree
    # (clickjacking). SAMEORIGIN permite que el propio sistema se
    # embeba a sí mismo, que es lo que necesitan las vistas de impresión.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Impide que el navegador "adivine" el tipo de un archivo ignorando
    # lo que el servidor declaró. Relevante justo aquí: los documentos
    # de alumnos son archivos subidos por usuarios, y sin esto un
    # navegador podría decidir ejecutar como HTML algo que se sirvió
    # como imagen.
    add_header X-Content-Type-Options "nosniff" always;

    # Evita que la URL completa (que incluye la matrícula del alumno,
    # ej. /alumno/LEN2024-00015/expediente) se filtre a sitios externos
    # a través de la cabecera Referer al hacer clic en un enlace.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El SGE no usa cámara, micrófono ni ubicación. Desactivarlos
    # explícitamente limita el daño si alguna vez se inyectara código.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS: obliga al navegador a usar SIEMPRE HTTPS con este dominio
    # durante un año, incluso si alguien escribe http:// a mano.
    #
    # ⚠️ DESCOMENTAR SOLO DESPUÉS de que certbot funcione y confirmes que
    #    el candado aparece sin advertencias (paso 10 de DEPLOYMENT.md).
    #    Si lo activas ANTES de tener un certificado válido, los
    #    navegadores que ya visitaron el sitio se negarán a entrar por
    #    HTTP y quedarás sin acceso hasta que expire el plazo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No anunciar la versión exacta de Nginx en cada respuesta ni en las
    # páginas de error: es información gratis para quien busque
    # vulnerabilidades conocidas de esa versión.
    server_tokens off;

    # --- Archivos estáticos: Nginx los sirve directo, sin pasar por Python ---
    location /static/ {
        alias /home/sge/sge_enfermeria/static/;
        expires 30d;
        access_log off;
        # NOTA: no agregar add_header aquí -- ver la advertencia de herencia
        # arriba. "expires" no rompe la herencia; add_header sí.
    }

    # --- Todo lo demás: reenviar a Gunicorn ---
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/sge/sge_enfermeria/sge.sock;
    }
}

# NOTA: después de correr certbot (ver DEPLOYMENT.md paso de HTTPS),
# certbot MODIFICA este archivo automáticamente para agregar el bloque
# de "listen 443 ssl" y redirigir el puerto 80 -> 443. No necesitas
# escribir eso a mano.
#
# Certbot CONSERVA las cabeceras de arriba al hacer ese cambio; solo
# verifica después con:
#     sudo nginx -t && sudo systemctl reload nginx
#     curl -I https://TU_DOMINIO.com     # deben aparecer las cabeceras
#
# ========================================================
# SOBRE CONTENT-SECURITY-POLICY (CSP) -- deliberadamente NO incluida
# ========================================================
# CSP es la cabecera más potente de todas, pero el SGE hoy NO puede
# usarla en su forma estricta, y activarla a medias da falsa sensación
# de seguridad. Los motivos son concretos:
#
#   1. Todas las plantillas cargan Bootstrap y Bootstrap Icons desde
#      cdn.jsdelivr.net, y dashboard_cobros.html carga Chart.js de ahí.
#   2. Cada plantilla trae su propio bloque <style> embebido.
#   3. Hay JavaScript embebido (dashboard_cobros.html,
#      configuracion_cobros.html) y manejadores onclick/onchange
#      inline en varias vistas (onclick="window.print()",
#      onsubmit="return confirm(...)").
#
# Una CSP que permita todo eso necesita 'unsafe-inline', que anula
# buena parte de su propósito. Si en el futuro se quiere CSP de verdad,
# el orden correcto es: primero mover el CSS/JS embebido a archivos en
# static/, quitar los manejadores inline, y solo entonces activarla.
# Mientras tanto, es preferible no ponerla que ponerla decorativa.
